services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liftbay
      POSTGRES_PASSWORD: liftbay
      POSTGRES_DB: liftbay
    ports: ["5443:5432"]
    volumes: [liftbay_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftbay -d liftbay"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://liftbay:liftbay@db:5432/liftbay
      SEED_ON_EMPTY: "true"
    ports: ["9200:9200"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [api]
volumes:
  liftbay_pg:
